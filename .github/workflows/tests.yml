name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Only the packages the tests need. The heavy dependencies (PyTorch and
      # others) are added to this step as the tests start to use them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyMuPDF fonttools opencv-python-headless numpy scipy verovio music21 musicdiff
          python -m pip install -e .
      - name: Run tests
        run: python -m pytest

  regression:
    name: Regression set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF fonttools opencv-python-headless numpy scipy verovio music21 musicdiff lxml
          python -m pip install -e .
      # Runs the stand-in recognisers over regression/ and fails if any figure
      # is worse than regression/baseline.txt by more than the margin.
      - name: Check against the baseline
        run: python scripts/check_regression.py
      # Reads the notes of every regression PDF (Stage 1.3) and fails if the
      # note accuracy falls below the floor. Raise the floor as the reader improves.
      - name: Notes read from the PDFs
        run: python scripts/check_notes.py --workers 2 --min-accuracy 98.0
      # Reads the text and markings of every regression PDF (Stage 1.4) and fails
      # if ACC-6 (dynamics and hairpins, exact pairs) falls below the floor.
      - name: Text and markings read from the PDFs
        run: python scripts/check_markings.py --workers 2 --min-acc6 97.0
      # Flags the bars that may be wrong (Stage 1.5) and fails if the share of
      # note errors in flagged bars (ACC-4, exact pairs) falls below the floor.
      - name: Confidence flags against the note errors
        run: python scripts/check_flags.py --workers 2 --min-recall 92.0
      # Writes every regression PDF as MusicXML (Stage 1.6) and fails if the
      # harness reads back anything different, scores the file differently from
      # the score in memory, or the file is not valid MusicXML 4.0. Braille is
      # made too; files music21 cannot translate are listed but do not fail.
      - name: MusicXML written from the PDFs
        run: |
          mkdir -p schema
          for f in musicxml.xsd xlink.xsd xml.xsd; do
            curl -sSfL -o schema/$f https://raw.githubusercontent.com/w3c/musicxml/v4.0/schema/$f
          done
          sed -i 's#http://www.musicxml.org/xsd/##' schema/musicxml.xsd
          python scripts/check_convert.py --workers 2 --schema schema/musicxml.xsd --braille
